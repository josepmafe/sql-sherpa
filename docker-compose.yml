services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${SHERPA_DB_NAME:-sherpa}
      SHERPA_ADMIN_USER: ${SHERPA_ADMIN_USER:-sherpa_admin}
      SHERPA_ADMIN_PASSWORD: ${SHERPA_ADMIN_PASSWORD}
      SHERPA_AGENT_USER: ${SHERPA_AGENT_USER:-sherpa_agent}
      SHERPA_AGENT_PASSWORD: ${SHERPA_AGENT_PASSWORD}
    ports:
      # Localhost only: the .env passwords are dev placeholders, so the database must not be reachable from the LAN.
      - "127.0.0.1:${SHERPA_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
