# One compose project for every checkout and worktree of the repo, so they all share one Postgres container and
# one data volume instead of each folder getting its own (which would also clash on the port).
name: sql-sherpa

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${SHERPA_DB_NAME:-sherpa}
      SHERPA_ADMIN_USER: ${SHERPA_ADMIN_USER:-sherpa_admin}
      SHERPA_ADMIN_PASSWORD: ${SHERPA_ADMIN_PASSWORD:?set it in .env}
      SHERPA_AGENT_USER: ${SHERPA_AGENT_USER:-sherpa_agent}
      SHERPA_AGENT_PASSWORD: ${SHERPA_AGENT_PASSWORD:?set it in .env}
      SHERPA_UI_USER: ${SHERPA_UI_USER:-sherpa_ui}
      SHERPA_UI_PASSWORD: ${SHERPA_UI_PASSWORD:?set it in .env}
    ports:
      # Localhost only: the .env passwords are dev placeholders, so the database must not be reachable from the LAN.
      - "127.0.0.1:${SHERPA_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data-platform/postgres/init:/docker-entrypoint-initdb.d:ro
      # The role SQL as a folder (Docker would create a missing single file as a directory). Not in initdb.d, where
      # its files would run on their own without their variables.
      - ./data-platform/postgres:/sherpa:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp:
    build:
      context: .
      dockerfile: agent/mcp-server/Dockerfile
    # No env_file: the agent-facing container gets only the variables it needs (least privilege), never the admin
    # login, POSTGRES_PASSWORD or host-only settings from .env. Compose reads the ${...} values from .env.
    environment:
      SHERPA_DB_HOST: postgres
      SHERPA_DB_PORT: "5432"
      SHERPA_DB_NAME: ${SHERPA_DB_NAME:-sherpa}
      SHERPA_AGENT_USER: ${SHERPA_AGENT_USER:-sherpa_agent}
      SHERPA_AGENT_PASSWORD: ${SHERPA_AGENT_PASSWORD:?set it in .env}
      MCP_TRANSPORT: http
      # All interfaces inside the container; the published port below is localhost only.
      SHERPA_MCP_HOST: 0.0.0.0
      SHERPA_MCP_PORT: "8765"
      SHERPA_DBT_TARGET_PATH: /app/dbt/target-prod
      SHERPA_MCP_POOL_SIZE: ${SHERPA_MCP_POOL_SIZE:-4}
      # Optional: empty means no export.
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    volumes:
      # The dbt folder, not target-prod itself: Docker would create a missing target-prod as an empty root-owned
      # directory, and a target-prod deleted and rebuilt on the host would leave the container on a stale mount.
      - ./data-platform/dbt:/app/dbt:ro
    # A ceiling for a query whose rows are huge before the server cuts each cell to 10,000 characters; if a query
    # still runs the server out of memory, Docker restarts it.
    mem_limit: 1g
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SHERPA_MCP_PORT:-8765}:8765"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    # No env_file, for the same reason as mcp: the web-facing container gets only the read-only sherpa_ui login,
    # never the admin login or POSTGRES_PASSWORD.
    environment:
      SHERPA_DB_HOST: postgres
      SHERPA_DB_PORT: "5432"
      SHERPA_DB_NAME: ${SHERPA_DB_NAME:-sherpa}
      SHERPA_UI_USER: ${SHERPA_UI_USER:-sherpa_ui}
      SHERPA_UI_PASSWORD: ${SHERPA_UI_PASSWORD:?set it in .env}
      SHERPA_UI_DBT_TARGET_PATH: /app/dbt/target-prod
    volumes:
      # The dbt folder, not target-prod itself (see mcp): a rebuilt target-prod must not leave a stale mount.
      - ./data-platform/dbt:/app/dbt:ro
    mem_limit: 1g
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SHERPA_UI_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Any 200 is healthy: a missing dbt artifact is a banner in the UI, so `make up` works before `make build-prod`.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    name: sherpa_pgdata
