# The Home page's figures (UI spec section 6.2). Every query reads only marts.dim_date, marts.fct_orders and
# marts.fct_refunds (the sherpa_home exposure lists them), takes as_of from the data (never now()), and compares
# the last 30 days (as_of - 30, as_of] with the 30 before (as_of - 60, as_of - 30].

# One row: the last day with orders and the first.
period: |
  select max(order_date) as as_of_date, min(order_date) as first_order_date
  from marts.fct_orders

# Each tile returns one row: this_period and last_period.
tiles:
  - id: net_revenue
    title: Net revenue
    format: currency
    decimals: 0
    up_is_good: true
    note: Recent orders' refunds are still arriving (up to about 40 days), so the latest period reads slightly high.
    sql: |
      with bounds as (select max(order_date) as as_of from marts.fct_orders)
      select
        coalesce(sum(o.net_revenue) filter (where o.order_date > b.as_of - 30), 0) as this_period,
        coalesce(sum(o.net_revenue) filter (where o.order_date <= b.as_of - 30), 0) as last_period
      from bounds as b
      left join marts.fct_orders as o on o.order_date > b.as_of - 60 and not o.is_cancelled

  - id: orders
    title: Orders
    format: count
    decimals: 0
    up_is_good: true
    sql: |
      with bounds as (select max(order_date) as as_of from marts.fct_orders)
      select
        count(o.order_id) filter (where o.order_date > b.as_of - 30) as this_period,
        count(o.order_id) filter (where o.order_date <= b.as_of - 30) as last_period
      from bounds as b
      left join marts.fct_orders as o on o.order_date > b.as_of - 60 and not o.is_cancelled

  - id: aov
    title: AOV
    format: currency
    decimals: 2
    up_is_good: true
    sql: |
      with bounds as (select max(order_date) as as_of from marts.fct_orders)
      select
        sum(o.net_revenue) filter (where o.order_date > b.as_of - 30)
          / nullif(count(o.order_id) filter (where o.order_date > b.as_of - 30), 0) as this_period,
        sum(o.net_revenue) filter (where o.order_date <= b.as_of - 30)
          / nullif(count(o.order_id) filter (where o.order_date <= b.as_of - 30), 0) as last_period
      from bounds as b
      left join marts.fct_orders as o on o.order_date > b.as_of - 60 and not o.is_cancelled

  - id: refund_rate
    title: Refund rate
    format: percent
    decimals: 1
    up_is_good: false
    sql: |
      with bounds as (select max(order_date) as as_of from marts.fct_orders),
      refunds as (
        select
          coalesce(sum(r.revenue_amount) filter (where r.refund_date > b.as_of - 30), 0) as this_period,
          coalesce(sum(r.revenue_amount) filter (where r.refund_date <= b.as_of - 30), 0) as last_period
        from bounds as b
        left join marts.fct_refunds as r on r.refund_date > b.as_of - 60 and r.refund_date <= b.as_of
      ),
      sales as (
        select
          coalesce(sum(o.gross_revenue) filter (where o.order_date > b.as_of - 30), 0) as this_period,
          coalesce(sum(o.gross_revenue) filter (where o.order_date <= b.as_of - 30), 0) as last_period
        from bounds as b
        left join marts.fct_orders as o on o.order_date > b.as_of - 60 and not o.is_cancelled
      )
      select
        refunds.this_period / nullif(sales.this_period, 0) as this_period,
        refunds.last_period / nullif(sales.last_period, 0) as last_period
      from refunds
      cross join sales

  - id: new_customers
    title: New customers
    format: count
    decimals: 0
    up_is_good: true
    sql: |
      with bounds as (select max(order_date) as as_of from marts.fct_orders)
      select
        count(o.order_id) filter (where o.order_date > b.as_of - 30) as this_period,
        count(o.order_id) filter (where o.order_date <= b.as_of - 30) as last_period
      from bounds as b
      left join marts.fct_orders as o on o.order_date > b.as_of - 60 and o.is_first_order

# The last 26 weeks (fewer when the history is shorter), oldest first, with zero for a week without orders.
trend: |
  with extent as (select max(order_date) as as_of, min(order_date) as first_order from marts.fct_orders),
  bounds as (
    select last_day.week_start as as_of_week, first_day.week_start as first_week
    from extent
    inner join marts.dim_date as last_day on last_day.date_day = extent.as_of
    inner join marts.dim_date as first_day on first_day.date_day = extent.first_order
  ),
  weeks as (
    select d.week_start, d.is_black_friday_week
    from bounds as b
    inner join marts.dim_date as d
      on d.date_day = d.week_start
      and d.week_start between greatest(b.as_of_week - 175, b.first_week) and b.as_of_week
  ),
  revenue as (
    select d.week_start, sum(o.net_revenue) as net_revenue
    from marts.fct_orders as o
    inner join marts.dim_date as d on d.date_day = o.order_date
    where not o.is_cancelled
    group by d.week_start
  )
  select w.week_start, coalesce(r.net_revenue, 0) as net_revenue, w.is_black_friday_week
  from weeks as w
  left join revenue as r on r.week_start = w.week_start
  order by w.week_start
