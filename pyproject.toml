[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sql-sherpa"
version = "0.1.0"
description = "Synthetic e-commerce warehouse (generator + dbt on Postgres) and a text-to-SQL agent on top of it."
requires-python = ">=3.12,<3.13"

[dependency-groups]
dev = [
    "pytest",
    "psycopg[binary]",
    "ruff",
    "mypy",
    "pre-commit",
    "mutmut>=3.8.0",
]
generator = [
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]",
    "faker>=40.43.0",
    "tzdata>=2026.5",
]

[tool.uv]
default-groups = ["dev", "generator"]

[tool.hatch.build.targets.wheel]
packages = ["generator/src/sherpa_generator"]

[tool.pytest.ini_options]
testpaths = ["generator/tests"]
markers = [
    "integration: needs Postgres",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "T20", "LOG", "G", "C4", "TC", "PT", "RUF"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sherpa_generator.records.base.RawRecord",
]

[tool.mypy]
files = ["generator/src"]
python_version = "3.12"
disallow_untyped_defs = true

[tool.mutmut]
# paths_to_mutate is passed per run (make mutate MODULE=...)
tests_dir = ["generator/tests/"]
