[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sql-sherpa"
version = "0.1.0"
description = "Synthetic e-commerce warehouse (generator + dbt on Postgres) and a text-to-SQL agent on top of it."
requires-python = ">=3.12,<3.13"

[project.scripts]
sherpa-generate = "sherpa_generator.cli:app"
sherpa-mcp = "sherpa_mcp.server:main"

[dependency-groups]
dev = [
    "pytest",
    "psycopg[binary]",
    "ruff",
    "mypy",
    "pre-commit",
    "types-pyyaml>=6.0.12.20260906",
    "httpx>=0.28.1",
]
dbt = [
    "dbt-core==1.12.6",
    "dbt-postgres==1.11.0",
    "sqlfluff",
    "sqlfluff-templater-dbt",
]
generator = [
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]",
    "faker>=40.43.0",
    "tzdata>=2026.5",
    "typer>=0.27.3",
]
mcp = [
    "logfire[psycopg]>=5.3.0",
    "mcp==2.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    # Pinned exactly: sqlglot's parser is the SQL guard's view of a query, so a bump is a guard change.
    "sqlglot==30.24.0",
]
ui = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
default-groups = ["dev", "generator", "dbt", "mcp", "ui"]

[tool.hatch.build.targets.wheel]
packages = ["data-platform/generator/src/sherpa_generator", "agent/mcp-server/src/sherpa_mcp", "ui/backend/src/sherpa_ui"]

[tool.pytest.ini_options]
testpaths = ["data-platform/generator/tests", "data-platform/tests", "agent/mcp-server/tests", "ui/backend/tests"]
pythonpath = ["data-platform/scripts", "data-platform/generator/tests"]  # scripts is not a package, and the generator tests import their helpers module
addopts = '-m "not slow and not warehouse" --import-mode=importlib'  # an explicit -m on the command line replaces the marker default; importlib lets two components both have a test_settings.py
# Pytest's default list without `build`, which would skip ui/backend/tests/build/.
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]
markers = [
    "integration: needs Postgres",
    "slow: full-year runs",
    "warehouse: needs `make build-prod` (the dev_marts test also `make build`, the eval database tests `make eval-db`)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "T20", "LOG", "G", "C4", "TC", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"data-platform/scripts/**" = ["T20"]  # scripts print their results (CLAUDE.md)
# FastAPI resolves the annotations of route functions (request, response models) at runtime
"ui/backend/src/sherpa_ui/api/*.py" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sherpa_generator.records.base.RawRecord",
]

[tool.logfire]
# sherpa_mcp.tools opens spans whether or not the process configured Logfire; unconfigured they record nothing.
ignore_no_config = true

[tool.mypy]
files = ["data-platform/generator/src", "agent/mcp-server/src", "ui/backend/src"]
python_version = "3.12"
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]  # lets GeneratorSettings() be built from the environment without arguments
