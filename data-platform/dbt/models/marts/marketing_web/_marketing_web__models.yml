version: 2

models:
  - name: fct_sessions
    description: >
      Web session fact, one row per session: one device's events (anonymous_id) with no gap over 30
      minutes, with the traffic source, device and the browse-to-purchase funnel flags. Sessions of
      test accounts are excluded. To count or sum orders by session attributes, join fct_orders to
      fct_sessions on session_id, not on order_id: a session holds only its first purchase's order.
      {{ doc('metric_conversion_rate') }}
    config:
      meta:
        domain: marketing_web
        grain: >-
          one row per web session, i.e. one device's (anonymous_id) events with no gap over 30
          minutes; app orders have no session
        primary_key: session_id
        synonyms: [visits, web sessions, traffic]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "session_end_at >= session_start_at"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "page_view_count <= event_count"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "purchased = (order_id is not null)"
    columns:
      - name: session_id
        description: >
          The session. Primary key. Join to fct_orders on session_id (not order_id) to count or sum
          orders by session attributes.
        data_type: text
        constraints:
          - type: not_null
          - type: primary_key
        data_tests: [unique, not_null]
      - name: anonymous_id
        description: The browser or app identifier (device) of the session.
        data_type: text
        data_tests: [not_null]
      - name: customer_id
        description: >
          Customer the device was identified as, from the most recent identification of the device
          (any time, so earlier sessions of a device that logs in later carry the customer too); null
          for a visitor never identified. Join to dim_customers on customer_id.
        data_type: bigint
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
              config:
                where: "customer_id is not null"
      - name: session_date
        description: UTC date the session started. Join to dim_date on date_day.
        data_type: date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: session_start_at
        description: When the session started, the first event's occurred_at (UTC).
        data_type: timestamptz
      - name: session_end_at
        description: When the session ended, the last event's occurred_at (UTC).
        data_type: timestamptz
      - name: duration_seconds
        description: Seconds between the first and the last event of the session; 0 for a one-event session.
        data_type: integer
        config:
          meta:
            synonyms: [session length, time on site]
      - name: event_count
        description: Number of events in the session.
        data_type: integer
      - name: page_view_count
        description: >
          Number of page_view events in the session. Only page_view events count: product pages are
          product_view events, so this is not the number of products viewed.
        data_type: integer
      - name: landing_page_path
        description: >
          Page path of the session's first event. In this data every visit starts on `/`; the few other
          values are visits the 30-minute rule split.
        data_type: text
        config:
          meta:
            synonyms: [landing page, entry page]
      - name: device_type
        description: Device type of the session's first event, desktop, mobile or tablet.
        data_type: text
        data_tests:
          - accepted_values:
              arguments:
                values: [desktop, mobile, tablet]
      - name: utm_source
        description: utm_source the session arrived with; null for untagged traffic.
        data_type: text
      - name: utm_medium
        description: utm_medium the session arrived with; null for untagged traffic.
        data_type: text
      - name: utm_campaign
        description: utm_campaign the session arrived with; null for untagged traffic.
        data_type: text
      - name: marketing_channel
        description: >
          Traffic source of the session: mapped from utm_source and utm_medium (channel_mapping),
          else organic or referral from the referrer, else direct; unknown for a tagged session
          whose utm pair is not mapped.
        data_type: text
        config:
          meta:
            synonyms: [channel, traffic source]
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [direct, organic, paid_search, paid_social, email, affiliate, referral, unknown]
      - name: campaign_id
        description: Campaign whose utm_campaign equals the session's; null when there is none.
        data_type: bigint
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_marketing__campaigns')
                field: campaign_id
              config:
                where: "campaign_id is not null"
      - name: is_first_session
        description: >
          True for the visitor's first session. The visitor is the identified customer when there is
          one (across devices), otherwise the device. A visitor who is not a customer gets a new
          device identifier every session, so every such session is a first session:
          `count(*) filter (where is_first_session)` counts customers plus anonymous sessions, not
          returning-visitor behaviour.
        data_type: boolean
        config:
          meta:
            synonyms: [new visitor]
      - name: viewed_product
        description: True when the session has a product_view event.
        data_type: boolean
      - name: added_to_cart
        description: True when the session has an add_to_cart event.
        data_type: boolean
      - name: began_checkout
        description: True when the session has a begin_checkout event.
        data_type: boolean
      - name: purchased
        description: >
          True when the session has a purchase event. {{ doc('metric_conversion_rate') }}
        data_type: boolean
        config:
          meta:
            synonyms: [converted]
      - name: order_id
        description: >
          The order the session's first purchase event created; null when the session did not purchase.
          A session with a second purchase leaves that later order to fct_orders.session_id alone, so
          join fct_orders on session_id to count orders by session attributes.
        data_type: bigint
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
              config:
                where: "order_id is not null"

unit_tests:
  - name: fct_sessions_aggregates_a_session
    model: fct_sessions
    given:
      - input: ref('int_events__sessionized')
        rows:
          - {event_id: e1, anonymous_id: a2, event_type: page_view, occurred_at: "2025-03-10 10:00:00+00", device_type: desktop, page_path: /home, session_id: s2, session_start_at: "2025-03-10 10:00:00+00", session_date: "2025-03-10", marketing_channel: direct}
          - {event_id: e2, anonymous_id: a2, event_type: product_view, occurred_at: "2025-03-10 10:05:00+00", device_type: desktop, page_path: /p/1, session_id: s2, session_start_at: "2025-03-10 10:00:00+00", session_date: "2025-03-10", marketing_channel: direct}
          - {event_id: e3, anonymous_id: a2, event_type: add_to_cart, occurred_at: "2025-03-10 10:06:00+00", device_type: desktop, page_path: /p/1, session_id: s2, session_start_at: "2025-03-10 10:00:00+00", session_date: "2025-03-10", marketing_channel: direct}
          - {event_id: e4, anonymous_id: a2, event_type: begin_checkout, occurred_at: "2025-03-10 10:08:00+00", device_type: desktop, page_path: /checkout, session_id: s2, session_start_at: "2025-03-10 10:00:00+00", session_date: "2025-03-10", marketing_channel: direct}
          - {event_id: e5, anonymous_id: a2, event_type: purchase, occurred_at: "2025-03-10 10:10:00+00", order_id: 9001, device_type: desktop, page_path: /thanks, session_id: s2, session_start_at: "2025-03-10 10:00:00+00", session_date: "2025-03-10", marketing_channel: direct}
          - {event_id: e6, anonymous_id: a2, event_type: page_view, occurred_at: "2025-03-11 09:00:00+00", device_type: mobile, page_path: /sale, session_id: s3, session_start_at: "2025-03-11 09:00:00+00", session_date: "2025-03-11", marketing_channel: direct}
          - {event_id: e7, anonymous_id: a2, event_type: purchase, occurred_at: "2025-03-10 10:12:00+00", order_id: 9002, device_type: desktop, page_path: /thanks, session_id: s2, session_start_at: "2025-03-10 10:00:00+00", session_date: "2025-03-10", marketing_channel: direct}
      - input: ref('int_identity__anonymous_to_customer')
        rows:
          - {anonymous_id: a2, customer_id: 202}
      - input: ref('stg_shop__customers')
        rows:
          - {customer_id: 202, is_test_account: false}
      - input: ref('stg_marketing__campaigns')
        rows: []
    expect:
      rows:
        - {session_id: s2, customer_id: 202, session_date: "2025-03-10", session_start_at: "2025-03-10 10:00:00+00", session_end_at: "2025-03-10 10:12:00+00", duration_seconds: 720, event_count: 6, page_view_count: 1, landing_page_path: /home, device_type: desktop, viewed_product: true, added_to_cart: true, began_checkout: true, purchased: true, order_id: 9001, is_first_session: true}
        - {session_id: s3, customer_id: 202, session_date: "2025-03-11", session_start_at: "2025-03-11 09:00:00+00", session_end_at: "2025-03-11 09:00:00+00", duration_seconds: 0, event_count: 1, page_view_count: 1, landing_page_path: /sale, device_type: mobile, viewed_product: false, added_to_cart: false, began_checkout: false, purchased: false, order_id: null, is_first_session: false}

  - name: fct_sessions_first_session_is_per_visitor_not_device
    model: fct_sessions
    given:
      - input: ref('int_events__sessionized')
        rows:
          # a4 is a second device of customer 202 with an earlier session: it, not s2, is the customer's first.
          - {event_id: e1, anonymous_id: a2, event_type: page_view, occurred_at: "2025-03-10 10:00:00+00", device_type: desktop, page_path: /, session_id: s2, session_start_at: "2025-03-10 10:00:00+00", session_date: "2025-03-10", marketing_channel: direct}
          - {event_id: e2, anonymous_id: a4, event_type: page_view, occurred_at: "2025-03-09 08:00:00+00", device_type: mobile, page_path: /, session_id: s4, session_start_at: "2025-03-09 08:00:00+00", session_date: "2025-03-09", marketing_channel: direct}
          # Two unidentified devices are two visitors, and the one tagged with a known campaign gets its id.
          - {event_id: e3, anonymous_id: a5, event_type: page_view, occurred_at: "2025-03-10 12:00:00+00", device_type: desktop, page_path: /, session_id: s5, session_start_at: "2025-03-10 12:00:00+00", session_date: "2025-03-10", marketing_channel: paid_search, session_utm_campaign: spring}
          - {event_id: e4, anonymous_id: a6, event_type: page_view, occurred_at: "2025-03-10 13:00:00+00", device_type: desktop, page_path: /, session_id: s6, session_start_at: "2025-03-10 13:00:00+00", session_date: "2025-03-10", marketing_channel: direct}
      - input: ref('int_identity__anonymous_to_customer')
        rows:
          - {anonymous_id: a2, customer_id: 202}
          - {anonymous_id: a4, customer_id: 202}
      - input: ref('stg_shop__customers')
        rows:
          - {customer_id: 202, is_test_account: false}
      - input: ref('stg_marketing__campaigns')
        rows:
          - {campaign_id: 7, utm_campaign: spring}
    expect:
      rows:
        - {session_id: s2, customer_id: 202, is_first_session: false, campaign_id: null}
        - {session_id: s4, customer_id: 202, is_first_session: true, campaign_id: null}
        - {session_id: s5, customer_id: null, is_first_session: true, campaign_id: 7}
        - {session_id: s6, customer_id: null, is_first_session: true, campaign_id: null}

  - name: fct_sessions_drops_test_account_sessions
    model: fct_sessions
    given:
      - input: ref('int_events__sessionized')
        rows:
          - {event_id: e1, anonymous_id: a1, event_type: page_view, occurred_at: "2025-03-10 10:00:00+00", device_type: desktop, page_path: /home, session_id: s1, session_start_at: "2025-03-10 10:00:00+00", session_date: "2025-03-10", marketing_channel: direct}
          - {event_id: e2, anonymous_id: a2, event_type: page_view, occurred_at: "2025-03-10 11:00:00+00", device_type: desktop, page_path: /home, session_id: s2, session_start_at: "2025-03-10 11:00:00+00", session_date: "2025-03-10", marketing_channel: direct}
      - input: ref('int_identity__anonymous_to_customer')
        rows:
          - {anonymous_id: a1, customer_id: 201}
          - {anonymous_id: a2, customer_id: 202}
      - input: ref('stg_shop__customers')
        rows:
          - {customer_id: 201, is_test_account: true}
          - {customer_id: 202, is_test_account: false}
      - input: ref('stg_marketing__campaigns')
        rows: []
    expect:
      rows:
        - {session_id: s2, customer_id: 202}
