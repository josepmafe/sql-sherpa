version: 2

models:
  - name: dim_customers_unmasked
    description: >
      The customer dimension with the real email and names, one row per customer except test accounts, with their
      order history (non-cancelled orders only), lifecycle segment, VIP flag and how they were acquired. It holds
      real PII, so no reader role can query it; only the dim_customers view reads it.
    config:
      access: private
      grants:
        select: []
      meta:
        domain: customers
        grain: one row per customer
        primary_key: customer_id
    columns:
      - name: customer_id
        description: The customer. Primary key.
        data_type: bigint
        constraints:
          - type: not_null
          - type: primary_key
      - name: email
        description: Normalized (trimmed, lower-case) email address; null when the customer is deleted.
        data_type: text
        config:
          meta:
            pii: true
      - name: first_name
        description: First name; null when the customer is deleted.
        data_type: text
        config:
          meta:
            pii: true
      - name: last_name
        description: Last name; null when the customer is deleted.
        data_type: text
        config:
          meta:
            pii: true
      - {name: country_code, description: Canonical ISO alpha-2 code of the customer's country., data_type: text}
      - {name: country_name, description: English name of the customer's country., data_type: text}
      - {name: region, description: Sales region of the customer's country., data_type: text}
      - {name: signup_at, description: When the customer created their account (UTC)., data_type: timestamptz}
      - {name: marketing_opt_in, description: True when the customer agreed to receive marketing emails., data_type: boolean}
      - {name: is_deleted, description: True when the customer deleted their account., data_type: boolean}
      - {name: lead_id, description: The CRM lead whose email matches the customer's; null when there is none., data_type: bigint}
      - {name: lead_source, description: How the matched lead was captured; null when there is none., data_type: text}
      - {name: acquisition_channel, description: Marketing channel of the first non-cancelled order; unknown when there is none., data_type: text}
      - {name: acquisition_campaign_id, description: Campaign that tagged the session of the first non-cancelled order; null when none., data_type: bigint}
      - {name: first_order_at, description: When the customer placed their first non-cancelled order (UTC); null if none., data_type: timestamptz}
      - {name: last_order_at, description: When the customer placed their latest non-cancelled order (UTC); null if none., data_type: timestamptz}
      - {name: order_count, description: Number of non-cancelled orders of the customer; 0 when none., data_type: integer}
      - {name: lifetime_gross_revenue, description: Sum of gross_revenue over the non-cancelled orders; 0 when none., data_type: "numeric(12,2)"}
      - {name: lifetime_net_revenue, description: Sum of net_revenue over the non-cancelled orders; 0 when none., data_type: "numeric(12,2)"}
      - {name: lifetime_refunded_revenue, description: Sum of refunded_revenue over the non-cancelled orders; 0 when none., data_type: "numeric(12,2)"}
      - {name: avg_order_value, description: lifetime_net_revenue divided by order_count; null without orders., data_type: "numeric(12,2)"}
      - {name: days_since_last_order, description: Days from the last order to as_of_date; null without orders., data_type: integer}
      - {name: customer_segment, description: "Lifecycle segment: prospect, new, active, at_risk or churned.", data_type: text}
      - {name: is_vip, description: True for the top 10% of buyers by lifetime_net_revenue., data_type: boolean}
  - name: dim_customers
    description: >
      Customer dimension, one row per customer except test accounts, with their order history
      (non-cancelled orders only), lifecycle segment, VIP flag and how they were acquired. The email is a
      salted hash and customer names are not published in this view. Soft-deleted customers are kept,
      with their email removed, so facts keep their customer. Recency is measured against as_of_date, the latest order_date in fct_orders,
      so results never depend on when the query runs.
    config:
      meta:
        domain: customers
        grain: one row per customer
        primary_key: customer_id
    columns:
      - name: customer_id
        description: The customer. Primary key.
        data_type: bigint
        data_tests: [unique, not_null]
      - name: email
        description: >-
          Salted md5 hash (32 hex characters) of the customer's normalized email; null for deleted customers.
          Equal emails hash equally, so counting, count(distinct ...), group by and joins work; comparing it with
          a plain value, a pattern (LIKE/ILIKE), a string function, length() or sorting gives meaningless results
          (some patterns match random rows). Identify customers by customer_id; questions about email domains
          cannot be answered.
        data_type: text
        config:
          meta:
            masked: true
      - name: country_code
        description: >
          Canonical ISO alpha-2 code of the customer's country; GB is the United Kingdom, which
          questions may call the UK, Britain or England.
        data_type: text
        data_tests:
          - relationships:
              arguments:
                to: ref('countries')
                field: code
      - name: country_name
        description: >
          English name of the customer's country, e.g. United Kingdom, which questions may call the UK,
          Britain or England.
        data_type: text
        config:
          meta:
            synonyms: [country]
      - name: region
        description: Sales region of the customer's country, DACH, Western Europe, Southern Europe, Benelux or UK & Ireland.
        data_type: text
        data_tests:
          - accepted_values:
              arguments:
                values: [DACH, Western Europe, Southern Europe, Benelux, UK & Ireland]
      - name: signup_at
        description: When the customer created their account (UTC).
        data_type: timestamptz
        config:
          meta:
            synonyms: [registration date, created at]
      - name: marketing_opt_in
        description: True when the customer agreed to receive marketing emails.
        data_type: boolean
      - name: is_deleted
        description: True when the customer deleted their account; their email is then null.
        data_type: boolean
      - name: lead_id
        description: >
          The CRM lead whose email matches the customer's; the earliest one when several match. Null
          when there is none.
        data_type: bigint
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_crm__leads')
                field: lead_id
              config:
                where: "lead_id is not null"
      - name: lead_source
        description: >
          How the matched lead was captured, newsletter, popup, giveaway or referral; null when there
          is none.
        data_type: text
        data_tests:
          - accepted_values:
              arguments:
                values: [newsletter, popup, giveaway, referral]
      - name: acquisition_channel
        description: >
          Marketing channel of the customer's first non-cancelled order (app for app orders, unknown
          for a web order whose purchase event has not arrived); unknown when they have no
          non-cancelled order, so unknown also covers every prospect. Filter on order_count >= 1 for
          acquisition analyses.
        data_type: text
        config:
          meta:
            synonyms: [acquisition source, first channel]
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [direct, organic, paid_search, paid_social, email, affiliate, referral, app, unknown]
      - name: acquisition_campaign_id
        description: >
          Campaign whose utm_campaign tagged the session of the customer's first non-cancelled order;
          null when that order has no session or the session no campaign.
        data_type: bigint
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_campaigns')
                field: campaign_id
              config:
                where: "acquisition_campaign_id is not null"
      - name: first_order_at
        description: When the customer placed their first non-cancelled order (UTC); null if none.
        data_type: timestamptz
      - name: last_order_at
        description: When the customer placed their latest non-cancelled order (UTC); null if none.
        data_type: timestamptz
      - name: order_count
        description: Number of non-cancelled orders of the customer; 0 when none.
        data_type: integer
        data_tests: [not_null]
      - name: lifetime_gross_revenue
        description: >
          Sum of gross_revenue over the customer's non-cancelled orders; 0 when none.
          {{ doc('metric_gross_revenue') }}
        data_type: numeric(12,2)
      - name: lifetime_net_revenue
        description: >
          Sum of net_revenue over the customer's non-cancelled orders; 0 when none.
          {{ doc('metric_net_revenue') }}
        data_type: numeric(12,2)
        config:
          meta:
            synonyms: [lifetime value, ltv, clv]
      - name: lifetime_refunded_revenue
        description: >
          Sum of refunded_revenue over the customer's non-cancelled orders; 0 when none.
          {{ doc('metric_refunded_revenue') }}
        data_type: numeric(12,2)
      - name: avg_order_value
        description: >
          lifetime_net_revenue divided by order_count; null when the customer has no non-cancelled
          order. {{ doc('metric_aov') }}
        data_type: numeric(12,2)
        config:
          meta:
            synonyms: [AOV, average order value]
      - name: days_since_last_order
        description: >
          Days from the UTC date of last_order_at to as_of_date (the latest order_date in fct_orders);
          null when the customer has no non-cancelled order.
        data_type: integer
        config:
          meta:
            synonyms: [recency]
      - name: customer_segment
        description: >
          Lifecycle segment: prospect (no non-cancelled order), new (1 order, the last 90 days ago or
          less), active (2 or more orders, the last 90 days ago or less), at_risk (last order 91 to
          180 days ago) or churned (more than 180 days ago).
        data_type: text
        config:
          meta:
            synonyms: [lifecycle stage, segment]
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [prospect, new, active, at_risk, churned]
      - name: is_vip
        description: >
          True for the top 10% of buyers (customers with at least one non-cancelled order) by
          lifetime_net_revenue, rounded up; ties go to the lowest customer_id.
        data_type: boolean
        config:
          meta:
            synonyms: [vip]
  - name: fct_leads_unmasked
    description: >
      The CRM lead fact with the real email, one row per lead, with whether and when the lead became a customer
      and how many emails it received, opened and clicked. It holds real PII, so no reader role can query it; only
      the fct_leads view reads it.
    config:
      access: private
      grants:
        select: []
      meta:
        domain: customers
        grain: one row per CRM lead
        primary_key: lead_id
    columns:
      - name: lead_id
        description: The CRM lead. Primary key.
        data_type: bigint
        constraints:
          - type: not_null
          - type: primary_key
      - name: email
        description: Normalized (trimmed, lower-case) email address of the lead; null when the lead's customer is deleted.
        data_type: text
        config:
          meta:
            pii: true
      - {name: lead_source, description: How the lead was captured., data_type: text}
      - {name: lifecycle_stage, description: The CRM's funnel stage of the lead., data_type: text}
      - {name: created_at, description: When the lead was captured (UTC)., data_type: timestamptz}
      - {name: is_converted, description: True when a customer has this lead's email., data_type: boolean}
      - {name: converted_customer_id, description: The customer whose lead_id is this lead; null when unconverted., data_type: bigint}
      - {name: converted_at, description: When the converted customer signed up (UTC); null when unconverted., data_type: timestamptz}
      - {name: days_to_convert, description: UTC days from created_at to converted_at; null when unconverted., data_type: integer}
      - {name: emails_sent, description: Number of emails sent to the lead; 0 when none., data_type: integer}
      - {name: emails_opened, description: Number of those emails that were opened; 0 when none., data_type: integer}
      - {name: emails_clicked, description: Number of those emails that were clicked; 0 when none., data_type: integer}
  - name: fct_leads
    description: >
      CRM lead fact, one row per lead: how it was captured, whether and when it became a customer, and how many
      emails it received, opened and clicked. A lead converts when a customer has its email, so a test account
      never converts a lead. The email is a salted hash. Newsletter sends count as well.
    config:
      meta:
        domain: customers
        grain: one row per CRM lead
        primary_key: lead_id
        synonyms: [leads, subscribers, prospects]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_converted = (converted_customer_id is not null)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "lifecycle_stage <> 'customer' or is_converted"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "emails_opened <= emails_sent"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "emails_clicked <= emails_sent"
    columns:
      - name: lead_id
        description: The CRM lead. Primary key.
        data_type: bigint
        data_tests: [unique, not_null]
      - name: email
        description: >-
          Salted md5 hash (32 hex characters) of the lead's normalized email; null when the lead's customer is
          deleted. Equal emails hash equally, so counting, count(distinct ...), group by and joins work; comparing
          it with a plain value, a pattern (LIKE/ILIKE), a string function, length() or sorting gives meaningless
          results (some patterns match random rows). Identify leads by lead_id and their customers by
          converted_customer_id; questions about email domains cannot be answered.
        data_type: text
        config:
          meta:
            masked: true
      - name: lead_source
        description: How the lead was captured, newsletter, popup, giveaway or referral.
        data_type: text
        data_tests:
          - accepted_values:
              arguments:
                values: [newsletter, popup, giveaway, referral]
      - name: lifecycle_stage
        description: >
          The CRM's funnel stage of the lead: subscriber, lead, mql or customer. It can lag behind is_converted: a
          converted lead is not always at customer yet, but a lead at customer is always converted.
        data_type: text
        data_tests:
          - accepted_values:
              arguments:
                values: [subscriber, lead, mql, customer]
      - name: created_at
        description: When the lead was captured (UTC).
        data_type: timestamptz
      - name: is_converted
        description: True when a customer has this lead's email, i.e. the lead became a customer.
        data_type: boolean
        config:
          meta:
            synonyms: [converted, became a customer]
      - name: converted_customer_id
        description: The customer whose lead_id is this lead; null when the lead is unconverted. Join to dim_customers on customer_id.
        data_type: bigint
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
              config:
                where: "converted_customer_id is not null"
      - name: converted_at
        description: When the converted customer signed up (UTC); null when the lead is unconverted.
        data_type: timestamptz
      - name: days_to_convert
        description: UTC days from created_at to converted_at, never negative; null when the lead is unconverted.
        data_type: integer
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: emails_sent
        description: Number of emails sent to the lead, newsletters included; 0 when none.
        data_type: integer
      - name: emails_opened
        description: Number of the lead's emails with an opened_at; 0 when none.
        data_type: integer
      - name: emails_clicked
        description: Number of the lead's emails with a clicked_at; 0 when none.
        data_type: integer

unit_tests:
  - name: dim_customers_segments_at_the_90_and_180_day_boundaries
    model: dim_customers_unmasked
    given:
      - input: ref('stg_shop__customers')
        rows:
          - {customer_id: 1, country_code: DE, is_test_account: false, is_deleted: false}
          - {customer_id: 2, country_code: DE, is_test_account: false, is_deleted: false}
          - {customer_id: 3, country_code: DE, is_test_account: false, is_deleted: false}
          - {customer_id: 4, country_code: DE, is_test_account: false, is_deleted: false}
          - {customer_id: 5, country_code: DE, is_test_account: false, is_deleted: false}
          - {customer_id: 6, country_code: DE, is_test_account: false, is_deleted: false}
          - {customer_id: 7, country_code: DE, is_test_account: false, is_deleted: false}
      - input: ref('countries')
        rows:
          - {code: DE, name: Germany, region: Europe}
      # Ephemeral models can only be given as SQL.
      - input: ref('int_identity__lead_to_customer')
        format: sql
        rows: |
          select
            null::bigint as customer_id,
            null::bigint as lead_id,
            null::text as lead_source
          where false
      - input: ref('stg_marketing__campaigns')
        rows: []
      - input: ref('int_events__sessionized')
        rows: []
      # as_of_date is the latest order_date: the order of customer 7 on 2025-06-30.
      - input: ref('fct_orders')
        rows:
          - {order_id: 101, customer_id: 1, placed_at: "2025-04-01 10:00:00+00", order_date: "2025-04-01", is_cancelled: false}
          - {order_id: 102, customer_id: 2, placed_at: "2025-03-31 10:00:00+00", order_date: "2025-03-31", is_cancelled: false}
          - {order_id: 103, customer_id: 3, placed_at: "2025-02-01 10:00:00+00", order_date: "2025-02-01", is_cancelled: false}
          - {order_id: 104, customer_id: 3, placed_at: "2025-04-01 10:00:00+00", order_date: "2025-04-01", is_cancelled: false}
          - {order_id: 105, customer_id: 4, placed_at: "2025-01-01 10:00:00+00", order_date: "2025-01-01", is_cancelled: false}
          - {order_id: 106, customer_id: 5, placed_at: "2024-12-31 10:00:00+00", order_date: "2024-12-31", is_cancelled: false}
          - {order_id: 107, customer_id: 7, placed_at: "2025-06-30 10:00:00+00", order_date: "2025-06-30", is_cancelled: false}
    expect:
      rows:
        - {customer_id: 1, order_count: 1, days_since_last_order: 90, customer_segment: new}
        - {customer_id: 2, order_count: 1, days_since_last_order: 91, customer_segment: at_risk}
        - {customer_id: 3, order_count: 2, days_since_last_order: 90, customer_segment: active}
        - {customer_id: 4, order_count: 1, days_since_last_order: 180, customer_segment: at_risk}
        - {customer_id: 5, order_count: 1, days_since_last_order: 181, customer_segment: churned}
        - {customer_id: 6, order_count: 0, days_since_last_order: null, customer_segment: prospect}
        - {customer_id: 7, order_count: 1, days_since_last_order: 0, customer_segment: new}

  - name: fct_leads_unconverted_lead_has_nulls_and_zero_counts
    model: fct_leads_unmasked
    given:
      - input: ref('stg_crm__leads')
        rows:
          - {lead_id: 1, email: a@example.com, lead_source: popup, lifecycle_stage: lead, created_at: "2025-02-01 10:00:00+00"}
      - input: ref('dim_customers')
        rows:
          - {customer_id: 10, lead_id: 99, signup_at: "2025-02-05 10:00:00+00", is_deleted: false}
      - input: ref('stg_crm__email_sends')
        rows: []
    expect:
      rows:
        - {lead_id: 1, is_converted: false, converted_customer_id: null, converted_at: null, days_to_convert: null, emails_sent: 0, emails_opened: 0, emails_clicked: 0}

  - name: fct_leads_converted_lead_counts_days_and_emails
    model: fct_leads_unmasked
    given:
      - input: ref('stg_crm__leads')
        rows:
          - {lead_id: 1, email: a@example.com, lead_source: popup, lifecycle_stage: customer, created_at: "2025-02-01 10:00:00+00"}
          - {lead_id: 2, email: b@example.com, lead_source: referral, lifecycle_stage: mql, created_at: "2025-02-01 08:00:00+00"}
      - input: ref('dim_customers')
        rows:
          - {customer_id: 10, lead_id: 1, signup_at: "2025-02-11 09:00:00+00", is_deleted: false}
          - {customer_id: 20, lead_id: 2, signup_at: "2025-02-01 23:00:00+00", is_deleted: false}
      - input: ref('stg_crm__email_sends')
        rows:
          - {email_send_id: 1, lead_id: 1, sent_at: "2025-02-02 10:00:00+00", opened_at: "2025-02-02 11:00:00+00", clicked_at: "2025-02-02 11:05:00+00"}
          - {email_send_id: 2, lead_id: 1, sent_at: "2025-02-05 10:00:00+00", opened_at: "2025-02-05 12:00:00+00", clicked_at: null}
          - {email_send_id: 3, lead_id: 1, sent_at: "2025-02-08 10:00:00+00", opened_at: null, clicked_at: null}
    expect:
      rows:
        - {lead_id: 1, email: a@example.com, is_converted: true, converted_customer_id: 10, days_to_convert: 10, emails_sent: 3, emails_opened: 2, emails_clicked: 1}
        - {lead_id: 2, email: b@example.com, is_converted: true, converted_customer_id: 20, days_to_convert: 0, emails_sent: 0, emails_opened: 0, emails_clicked: 0}

  - name: fct_leads_deleted_customer_lead_has_no_email
    model: fct_leads_unmasked
    given:
      - input: ref('stg_crm__leads')
        rows:
          - {lead_id: 1, email: a@example.com, lead_source: popup, lifecycle_stage: customer, created_at: "2025-02-01 10:00:00+00"}
      - input: ref('dim_customers')
        rows:
          - {customer_id: 10, lead_id: 1, signup_at: "2025-02-03 09:00:00+00", is_deleted: true}
      - input: ref('stg_crm__email_sends')
        rows: []
    expect:
      rows:
        - {lead_id: 1, email: null, is_converted: true, converted_customer_id: 10}
