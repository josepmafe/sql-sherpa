version: 2

models:
  - name: stg_events__events
    description: >
      One row per tracked event. Duplicates from the tracker (R1) are removed, the text timestamp
      occurred_at is parsed to timestamptz honouring the client's UTC offset, and the context and
      properties JSON are flattened into columns.
    columns:
      - name: event_id
        description: Primary key (UUID as text), unique after the R1 dedupe.
        data_tests: [unique, not_null]
      - name: anonymous_id
        description: Browser or device identifier; present on every event.
        data_tests: [not_null]
      - name: customer_id
        description: Customer who triggered the event; null while the visitor is anonymous.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_shop__customers')
                field: customer_id
      - name: event_type
        description: Kind of event.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - page_view
                  - product_view
                  - add_to_cart
                  - remove_from_cart
                  - begin_checkout
                  - purchase
                  - signup
                  - login
      - name: occurred_at
        description: When the event happened on the client, as a timestamptz (the client's UTC offset is honoured).
        data_tests: [not_null]
      - name: received_at
        description: When the tracker received the event (UTC); late events (R2) arrive 1 to under 4 days after occurred_at.
        data_tests:
          - not_null
          - dbt_expectations.expect_row_values_to_have_recent_data:
              arguments:
                datepart: day
                interval: 3
              config:
                severity: warn
      - name: device_type
        description: desktop, mobile or tablet.
        data_tests:
          - accepted_values:
              arguments:
                values: [desktop, mobile, tablet]
      - name: utm_source
        description: UTM source on the visit; null if none.
      - name: utm_medium
        description: UTM medium on the visit; null if none.
      - name: utm_campaign
        description: UTM campaign slug on the visit; null if none.
      - name: referrer
        description: Referring site; null if none.
      - name: page_path
        description: Page path viewed; null for events without a page.
      - name: product_id
        description: Product involved in the event; null otherwise.
      - name: variant_id
        description: Product variant involved in the event; null otherwise.
      - name: order_id
        description: Order created by a purchase event; null otherwise.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_shop__orders')
                field: order_id
      - name: cart_value
        description: >-
          Cart value in EUR, numeric(12,2). add_to_cart/begin_checkout: price of the carted item; purchase: the order
          subtotal. Null for other events.
