name: sherpa
version: "1.0.0"
profile: sherpa # which entry of profiles.yml to use

# Folders dbt reads. Models are SELECT statements dbt materializes; seeds are small CSVs
# loaded as tables; macros are reusable Jinja; snapshots capture history.
model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "target-prod", "target-eval", "target-sqlfluff", "target-scratch", "dbt_packages"]

# Project variables, read in models with {{ var('tax_rate') }}.
vars:
  tax_rate: 0.20
  session_timeout_minutes: 30
  date_spine_start: "2024-01-01"
  date_spine_end: "2028-12-31"
  # Required by dbt_date (used by dbt_expectations); all timestamps are UTC.
  "dbt_date:time_zone": "UTC"

# Runs once at the start of every dbt invocation.
on-run-start: "{{ ensure_extensions() }}"
# Runs once at the end of every dbt invocation: the run-results audit table, then read access to the marts (and
# the audit table for the UI) on prod and eval only. The order matters: the audit table must exist when it is granted.
on-run-end:
  - "{{ record_run_results(results) }}"
  - "{{ grant_read_access() }}"

# Folder-level defaults. "+schema" is a *custom* schema; the generate_schema_name macro
# turns it into the real schema name (dev_<name> on dev, <name> on prod).
models:
  sherpa:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: ephemeral
    marts:
      +schema: marts
      +materialized: table
      # Contracts make dbt check column names and types against the YAML before building.
      +contract:
        enforced: true
      # persist_docs copies descriptions into Postgres comments, where the agent can read them.
      +persist_docs:
        relation: true
        columns: true
      +post-hook: "analyze {{ this }}"
      # SELECT for the agent and UI roles on every target; it only takes effect where the role also has schema USAGE (prod, eval).
      # The default (the role name from .env.example) lets commands that only parse, like deps, run without .env.
      # dbt does not quote grantees; the on-run-start hook (ensure_extensions) rejects a malformed role name.
      +grants:
        select:
          - "{{ env_var('SHERPA_AGENT_USER', 'sherpa_agent') }}"
          - "{{ env_var('SHERPA_UI_USER', 'sherpa_ui') }}"

seeds:
  sherpa:
    +schema: seeds

snapshots:
  sherpa:
    +schema: snapshots
